name: Preview Build (No Secrets)

on:
  workflow_dispatch:

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Status Files
        run: |
          find buildScript libcore/*.sh -type f | xargs cat | sha1sum > golang_status
          git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}

      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25

      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs: libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Status Files
        run: |
          find buildScript libcore/*.sh -type f | xargs cat | sha1sum > golang_status
          git ls-files libcore | xargs cat | sha1sum > libcore_status
      
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Gradle 9.1 için Java 21 önerilir
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          # CI ortamında bellek yönetimi için kritik ayarlar
          _JAVA_OPTIONS: "-Xmx3g -XX:MaxMetaspaceSize=512m" 
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          
          chmod +x gradlew
          ./run init action gradle
          
          # --no-daemon: Çökmeleri engeller
          # --no-parallel: Bellek kullanımını düşürür
          # --stacktrace: Hata detayını gösterir
          ./gradlew app:assemblePreviewDebug --no-daemon --no-parallel --stacktrace
          
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "HATA: APK dosyası üretilemedi!"
            exit 1
          fi
          APK_DIR=$(dirname "$APK_PATH")
          echo "APK_DIR=$APK_DIR" >> $GITHUB_ENV

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Preview-APK
          path: ${{ env.APK_DIR }}
          
